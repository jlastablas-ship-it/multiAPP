<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server</title>
</head>
<body>
    <h1>Server</h1>
    <p id="result">Esperando mensaje...</p>

    <script>
        function responderAlFetch(message) {
            return message ? `Mensaje recibido: ${message}` : 'No se recibió ningún mensaje.';
        }

        const params = new URLSearchParams(window.location.search);
        const message = params.get('message');
        const result = document.getElementById('result');

        result.textContent = responderAlFetch(message);
    </script>
</body>
</html>
